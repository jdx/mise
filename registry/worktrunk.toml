backends = [
  { full = "packslip:github.com/max-sixty/worktrunk", min_version = "0.80.0", options = { identity_prefix = "https://github.com/max-sixty/worktrunk/.github/workflows/release.yaml@refs/tags/", issuer = "https://token.actions.githubusercontent.com" } },
  "aqua:max-sixty/worktrunk",
  "cargo:worktrunk",
]
bins = ["git-wt", "wt"]
description = "A CLI for git worktree management, designed for running AI agents in parallel."
test = { cmd = "wt --version", expected = "wt v{{version}}" }
version_order = "semver"
