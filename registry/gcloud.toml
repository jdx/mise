version_order = "semver"
# Only the linux-x64 archive bundles Python (since v352.0.0). On macOS, the vfox
# plugin looks for the Python version gcloud requires; on Windows it uses
# Google's bundled-Python archive unless bundled_python = "false" is set.
backends = ["vfox:mise-plugins/vfox-gcloud", "asdf:mise-plugins/mise-gcloud"]
bins = [
  "bq",
  "dev_appserver.py",
  "docker-credential-gcloud",
  "gcloud",
  "gcloud-crc32c",
  "git-credential-gcloud.sh",
  "gsutil",
  "java_dev_appserver.sh",
]
description = "GCloud CLI (Google Cloud SDK)"
test = { cmd = "gcloud version", expected = "Google Cloud SDK {{version}}" }
