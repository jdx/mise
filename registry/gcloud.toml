version_order = "semver"
# Google's linux-x64 archive bundles Python (since v352.0.0). On Windows x86_64,
# the vfox plugin uses Google's separate bundled-Python archive unless
# bundled_python = "false" is set. On macOS, the exact Python version gcloud
# requires must already be installed: the plugin finds it and passes it as
# CLOUDSDK_PYTHON. For v352.0.0 and later, if it is missing, the plugin warns
# and skips gcloud's own Python setup.
backends = ["vfox:mise-plugins/vfox-gcloud", "asdf:mise-plugins/mise-gcloud"]
bins = [
  "bq",
  "dev_appserver.py",
  "docker-credential-gcloud",
  "gcloud",
  "gcloud-crc32c",
  "git-credential-gcloud.sh",
  "gsutil",
  "java_dev_appserver.sh",
]
description = "GCloud CLI (Google Cloud SDK)"
test = { cmd = "gcloud version", expected = "Google Cloud SDK {{version}}" }
