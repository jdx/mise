description = "An approachable, portable, and productive language for high-quality apps on any platform"
url = "https://dart.dev"
version_order = "semver"

bins = [
  "dart",
  "dartaotruntime",
  "dartaotruntime_asan",
  "dartaotruntime_msan",
  "dartaotruntime_tsan",
  "dartvm",
]
[[backends]]
full = "http:dart"

[backends.options]
checksum_url = "https://storage.googleapis.com/dart-archive/channels/stable/release/{{ version }}/sdk/dartsdk-{{ os() }}-{{ arch() }}-release.zip.sha256sum"
url = "https://storage.googleapis.com/dart-archive/channels/stable/release/{{ version }}/sdk/dartsdk-{{ os() }}-{{ arch() }}-release.zip"
# The prefix listing in version_list_url carries no dates. Each release's VERSION object has a
# timeCreated, but the listing scans 1000 objects a page and stops after 119 of them.
version_date_expr = 'map(flatten(map(bodies, { fromJSON(#).items })), { [split(#.name, "/")[3], #.timeCreated] })'
version_date_next_expr = 'fromJSON(body).nextPageToken != nil ? split(url, "&pageToken=")[0] + "&pageToken=" + fromJSON(body).nextPageToken : nil'
version_date_url = "https://storage.googleapis.com/storage/v1/b/dart-archive/o?prefix=channels/stable/release/&matchGlob=**/VERSION&fields=items(name,timeCreated),nextPageToken"
version_expr = 'fromJSON(body).prefixes | filter({ # matches "^channels/stable/release/(\\d+\\.\\d+\\.\\d+)/$" }) | map({split(#, "/")[3]}) | sortVersions()'
version_list_url = "https://storage.googleapis.com/storage/v1/b/dart-archive/o?prefix=channels/stable/release/&delimiter=/"

[[backends]]
full = "asdf:mise-plugins/mise-dart"

[[backends]]
full = "vfox:jdx/vfox-dart"
