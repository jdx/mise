description = "Sentinel is a policy as code tool that lets you control what users of HashiCorp products are allowed to do. It enforces policies proactively, preventing end users from deploying changes that are not allowed"
test = { cmd = "sentinel version", expected = "Sentinel v{{version}}" }
url = "https://developer.hashicorp.com/sentinel"
version_order = "semver"

bins = ["sentinel"]
[[backends]]
full = "http:sentinel"

[backends.options]
checksum_url = "https://releases.hashicorp.com/sentinel/{{ version }}/sentinel_{{ version }}_SHA256SUMS"
url = 'https://releases.hashicorp.com/sentinel/{{ version }}/sentinel_{{ version }}_{{ os(macos="darwin") }}_{{ arch(x64="amd64") }}.zip'
version_expr = 'fromJSON(body).versions | keys() | sortVersions()'
version_list_url = "https://releases.hashicorp.com/sentinel/index.json"
# index.json lists versions without dates; the releases API has timestamp_created,
# at most 20 releases a page, newest first, and takes the last timestamp as `after`.
version_date_expr = 'map(flatten(map(bodies, { fromJSON(#) })), { [#.version, #.timestamp_created] })'
version_date_next_expr = 'len(fromJSON(body)) == 20 ? split(url, "&after=")[0] + "&after=" + last(fromJSON(body)).timestamp_created : nil'
version_date_url = "https://api.releases.hashicorp.com/v1/releases/sentinel?limit=20"

[[backends]]
full = "asdf:mise-plugins/mise-hashicorp"
