description = "An Omarchy native LocalSend client"
test = { cmd = "omasend --version", expected = "omasend {{version}}" }
version_order = "semver"

bins = ["omasend"]
[[backends]]
full = "github:huacnlee/omasend"

[backends.options.platforms.macos-arm64]
bin_path = "OmaSend.app/Contents/MacOS"

[backends.options.platforms.macos-x64]
bin_path = "OmaSend.app/Contents/MacOS"
