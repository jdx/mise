description = "A command line tool for building Cloudflare Workers"
test = { cmd = "wrangler --version", expected = "{{version}}", tools = [
  "aube",
] }

bins = ["cf-wrangler", "wrangler", "wrangler2"]
[[backends]]
full = "npm:wrangler"

[backends.options]
allow_builds = ["esbuild", "sharp", "workerd"]
