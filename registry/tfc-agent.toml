description = "HCP Terraform Agents allow HCP Terraform to communicate with isolated, private, or on-premises infrastructure"
os = ["linux"]
url = "https://developer.hashicorp.com/terraform/cloud-docs/agents"
version_order = "semver"

bins = ["tfc-agent", "tfc-agent-core"]
[[backends]]
full = "http:tfc-agent"

[backends.options]
checksum_url = "https://releases.hashicorp.com/tfc-agent/{{ version }}/tfc-agent_{{ version }}_SHA256SUMS"
url = 'https://releases.hashicorp.com/tfc-agent/{{ version }}/tfc-agent_{{ version }}_linux_{{ arch(x64="amd64") }}.zip'
version_expr = 'fromJSON(body).versions | keys() | sortVersions()'
version_list_url = "https://releases.hashicorp.com/tfc-agent/index.json"
# index.json lists versions without dates; the releases API has timestamp_created,
# at most 20 releases a page, newest first, and takes the last timestamp as `after`.
version_date_expr = 'map(flatten(map(bodies, { fromJSON(#) })), { [#.version, #.timestamp_created] })'
version_date_next_expr = 'len(fromJSON(body)) == 20 ? split(url, "&after=")[0] + "&after=" + last(fromJSON(body)).timestamp_created : nil'
version_date_url = "https://api.releases.hashicorp.com/v1/releases/tfc-agent?limit=20"

[[backends]]
full = "asdf:mise-plugins/mise-hashicorp"
