description = "ansible python package contains the core runtime and CLI tools, such as ansible and ansible-playbook and extra modules, plugins, and roles"
# pyyaml/pygit2 publish no Python 3.15 wheels yet; mise installs these with --no-build.
test = { cmd = "ansible --version", expected = "ansible", tools = [
  "python@3.14",
] }
version_order = "source"

bins = [
  "ansible",
  "ansible-community",
  "ansible-config",
  "ansible-console",
  "ansible-doc",
  "ansible-galaxy",
  "ansible-inventory",
  "ansible-playbook",
  "ansible-pull",
  "ansible-test",
  "ansible-vault",
]
[[backends]]
full = "pipx:ansible"

[backends.options]
expose = ["ansible-core"]
