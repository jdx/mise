backends = [
  { full = "aqua:npm/cli", platforms = [
    "linux",
    "macos",
  ] },
  "npm:npm",
]
bins = ["npm", "npx"]
description = "the package manager for JavaScript"
idiomatic_files = ["package.json"]
overrides = ["node"]
test = { cmd = "npm --version", expected = "{{version}}" }
version_order = "semver"
