backends = [
  "vfox:mise-plugins/vfox-clickhouse",
  "asdf:mise-plugins/mise-clickhouse",
]
bins = [
  "clickhouse",
  "clickhouse-benchmark",
  "clickhouse-client",
  "clickhouse-compressor",
  "clickhouse-format",
  "clickhouse-local",
  "clickhouse-obfuscator",
