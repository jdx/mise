backends = [
  { full = "packslip:github.com/jdx/jactionlint", min_version = "2.0.2", options = { workflow = "release.yaml" } },
  "aqua:jdx/jactionlint",
  "github:jdx/jactionlint",
]
bins = ["jactionlint"]
description = "Static checker for GitHub Actions workflow files, an actively maintained fork of actionlint"
test = { cmd = "jactionlint --version", expected = "{{version}}" }
version_order = "semver"
