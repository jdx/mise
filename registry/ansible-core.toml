aliases = ["ansible-base"]
backends = ["pipx:ansible-core"]
bins = [
  "ansible",
  "ansible-config",
  "ansible-console",
  "ansible-doc",
  "ansible-galaxy",
  "ansible-inventory",
  "ansible-playbook",
  "ansible-pull",
  "ansible-test",
  "ansible-vault",
]
description = "ansible-core python package contains the core runtime and CLI tools, such as ansible and ansible-playbook"
# pyyaml/pygit2 publish no Python 3.15 wheels yet; mise installs these with --no-build.
test = { cmd = "ansible --version", expected = "ansible [core {{version}}]", tools = [
  "python@3.14",
] }
version_order = "semver"
