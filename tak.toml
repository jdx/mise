# Instruction-counted benchmarks, measured by tak (https://github.com/jdx/tak).
#
# Every subject here is hermetic, and each was checked by running it with the
# proxy pointed at a dead port rather than assumed to be.
#
# The three config-resolving benchmarks run with MISE_OFFLINE=1, set by the
# `perf` task. Without it `ls`, `env` and `hook-env` reach the network and log
# HTTP warnings; with it they do not, and their output is byte-identical run to
# run. Offline covers less of mise than a real invocation does — but the part it
# leaves out is precisely the part no benchmark can measure repeatably.
#
# They read `benchmarks/perf-fixture`, a committed config pinning exact
# versions. A floating version would make the measurement depend on what the
# registry said that day.
#
# `mise --version` and `mise x -- echo` are deliberately absent: the first
# checks for updates, and the second cannot run offline because it has to
# resolve a tool.

# Variables no measured command inherits: the forge tokens tak removes by
# default, then the mise overrides that would point a run at the caller's own
# config, installs or environment instead of the fixture's. setup.sh removes the
# same ones before it prepares the large fixture.
[env]
deny = [
  "GITHUB_TOKEN",
  "GH_TOKEN",
  "MISE_CONFIG_FILE",
  "MISE_DOWNLOADS_DIR",
  "MISE_GLOBAL_CONFIG_FILE",
  "MISE_INSTALL_STORE_DIR",
  "MISE_PLUGINS_DIR",
  "MISE_SHARED_INSTALL_DIRS",
  "MISE_SHIMS_DIR",
  "MISE_SYSTEM_CONFIG_DIR",
  "MISE_SYSTEM_CONFIG_FILE",
  "MISE_SYSTEM_DATA_DIR",
  "MISE_SYSTEM_DIR",
  "MISE_SYSTEM_INSTALLS_DIR",
  "MISE_SYSTEM_PLUGINS_DIRS",
  "MISE_TMP_DIR",
  "MISE_ENV",
  "MISE_PROFILE",
]

# The fixed cost every invocation pays: process start, dynamic linking, and
# building the clap command tree. Reading the others against this separates
# "mise got slower to start" from "this command's path got slower".
[bench.startup]
cmd = ["./target/release/mise", "--help"]

# Config resolution: parse the fixture, resolve three tools against the local
# store, and report. This is the path a shell pays on every prompt.
[bench.ls]
cmd = ["./target/release/mise", "-C", "benchmarks/perf-fixture", "ls"]

# The same resolution, rendered as an environment. `env` and `hook-env` diverge
# in how they serialise, so a change in one and not the other is informative.
[bench.env]
cmd = ["./target/release/mise", "-C", "benchmarks/perf-fixture", "env"]

# What `mise activate` runs on every directory change, which makes it the
# command most sensitive to a startup regression.
[bench.hook-env]
cmd = ["./target/release/mise", "-C", "benchmarks/perf-fixture", "hook-env"]

# The compiled-in tool registry — 983 tools, ~75KB of output — walked and
# rendered. The largest pure-CPU path that needs neither network nor installed
# tools, and it grows every time a tool is added.
[bench.registry]
cmd = ["./target/release/mise", "registry"]
runs = 10

# The large benchmarks: a project the size of mise's own, with 29 tools across
# the aqua, github, packslip, npm and core backends, every one installed, a
# lockfile covering every platform, a nested config and 47 tasks. The fixture
# above pins three tools and installs none of them, so it never reaches the
# work mise does once per installed tool: building install paths, reading the
# lockfile and install receipts, and listing each tool's bin directories. These
# do, and that work is most of what a real `env` or `hook-env` costs.
#
# `setup.sh` builds the project in `$MISE_PERF_LARGE` (set by the `perf` tasks)
# with its own HOME and mise directories, and fakes an install of every locked
# version, so nothing is downloaded and nothing on the machine leaks in. Every
# benchmark repeats the same `env` because tak has no way yet to share one
# between some benchmarks and not others. MISE_CEILING_PATHS stops mise from
# reading the configs of whatever directory holds the work directory.
#
# `mise x` and the shims are missing here too: each ends by exec-ing its
# command, which leaves valgrind no process to count. `env-large` covers the config work they do first.

[bench.env-large]
cmd = [
  "./target/release/mise",
  "-C",
  "{{ env.MISE_PERF_LARGE }}/project",
  "env",
]
setup = [
  "bash",
  "benchmarks/large-fixture/setup.sh",
  "target/release/mise",
  "{{ env.MISE_PERF_LARGE }}",
]
env = { HOME = "{{ env.MISE_PERF_LARGE }}/home", MISE_DATA_DIR = "{{ env.MISE_PERF_LARGE }}/data", MISE_INSTALLS_DIR = "{{ env.MISE_PERF_LARGE }}/data/installs", MISE_CONFIG_DIR = "{{ env.MISE_PERF_LARGE }}/config", MISE_STATE_DIR = "{{ env.MISE_PERF_LARGE }}/state", MISE_CACHE_DIR = "{{ env.MISE_PERF_LARGE }}/cache", MISE_CEILING_PATHS = "{{ env.MISE_PERF_LARGE }}" }

# What every prompt in an activated shell pays when it has to recompute.
[bench.hook-env-large]
cmd = [
  "./target/release/mise",
  "-C",
  "{{ env.MISE_PERF_LARGE }}/project",
  "hook-env",
  "-s",
  "bash",
]
setup = [
  "bash",
  "benchmarks/large-fixture/setup.sh",
  "target/release/mise",
  "{{ env.MISE_PERF_LARGE }}",
]
env = { HOME = "{{ env.MISE_PERF_LARGE }}/home", MISE_DATA_DIR = "{{ env.MISE_PERF_LARGE }}/data", MISE_INSTALLS_DIR = "{{ env.MISE_PERF_LARGE }}/data/installs", MISE_CONFIG_DIR = "{{ env.MISE_PERF_LARGE }}/config", MISE_STATE_DIR = "{{ env.MISE_PERF_LARGE }}/state", MISE_CACHE_DIR = "{{ env.MISE_PERF_LARGE }}/cache", MISE_CEILING_PATHS = "{{ env.MISE_PERF_LARGE }}" }

[bench.ls-large]
cmd = ["./target/release/mise", "-C", "{{ env.MISE_PERF_LARGE }}/project", "ls"]
setup = [
  "bash",
  "benchmarks/large-fixture/setup.sh",
  "target/release/mise",
  "{{ env.MISE_PERF_LARGE }}",
]
env = { HOME = "{{ env.MISE_PERF_LARGE }}/home", MISE_DATA_DIR = "{{ env.MISE_PERF_LARGE }}/data", MISE_INSTALLS_DIR = "{{ env.MISE_PERF_LARGE }}/data/installs", MISE_CONFIG_DIR = "{{ env.MISE_PERF_LARGE }}/config", MISE_STATE_DIR = "{{ env.MISE_PERF_LARGE }}/state", MISE_CACHE_DIR = "{{ env.MISE_PERF_LARGE }}/cache", MISE_CEILING_PATHS = "{{ env.MISE_PERF_LARGE }}" }

# Loading every task, as completion and `mise tasks` do.
[bench.tasks-ls-large]
cmd = [
  "./target/release/mise",
  "-C",
  "{{ env.MISE_PERF_LARGE }}/project",
  "tasks",
  "ls",
]
setup = [
  "bash",
  "benchmarks/large-fixture/setup.sh",
  "target/release/mise",
  "{{ env.MISE_PERF_LARGE }}",
]
env = { HOME = "{{ env.MISE_PERF_LARGE }}/home", MISE_DATA_DIR = "{{ env.MISE_PERF_LARGE }}/data", MISE_INSTALLS_DIR = "{{ env.MISE_PERF_LARGE }}/data/installs", MISE_CONFIG_DIR = "{{ env.MISE_PERF_LARGE }}/config", MISE_STATE_DIR = "{{ env.MISE_PERF_LARGE }}/state", MISE_CACHE_DIR = "{{ env.MISE_PERF_LARGE }}/cache", MISE_CEILING_PATHS = "{{ env.MISE_PERF_LARGE }}" }

# Planning a run of eight dependent tasks, without running them: everything
# `mise run` does before its first task starts.
[bench.run-large]
cmd = [
  "./target/release/mise",
  "-C",
  "{{ env.MISE_PERF_LARGE }}/project",
  "run",
  "--dry-run",
  "build:step8",
]
setup = [
  "bash",
  "benchmarks/large-fixture/setup.sh",
  "target/release/mise",
  "{{ env.MISE_PERF_LARGE }}",
]
env = { HOME = "{{ env.MISE_PERF_LARGE }}/home", MISE_DATA_DIR = "{{ env.MISE_PERF_LARGE }}/data", MISE_INSTALLS_DIR = "{{ env.MISE_PERF_LARGE }}/data/installs", MISE_CONFIG_DIR = "{{ env.MISE_PERF_LARGE }}/config", MISE_STATE_DIR = "{{ env.MISE_PERF_LARGE }}/state", MISE_CACHE_DIR = "{{ env.MISE_PERF_LARGE }}/cache", MISE_CEILING_PATHS = "{{ env.MISE_PERF_LARGE }}" }
