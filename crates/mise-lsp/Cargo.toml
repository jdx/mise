[package]
name = "mise-lsp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Language server for mise config files"
repository = "https://github.com/jdx/mise"
include = ["src/**/*"]

[dependencies]
jsonschema = { version = "0.59", default-features = false }
regex = "1"
serde_json = "1"
toml_edit = { version = "0.25", features = ["parse"] }
