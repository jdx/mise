[package]
name = "mise-dotenv"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "dotenv parser with explicit control over variable substitution, vendored from dotenv-ng-core"
repository = "https://github.com/jdx/mise"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
temp-env = "0.3"

[lib]
doctest = false
