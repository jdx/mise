[package]
name = "mise-util"
version = "2026.9.0"
edition = "2024"
license = "MIT"
description = "Environment, directory, and filesystem helpers shared by mise's crates"
homepage = "https://github.com/jdx/mise"
repository = "https://github.com/jdx/mise"

[dependencies]
age = { version = "0.12", features = ["ssh", "plugin"] }
aho-corasick = "1"
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
] }
base64 = "0.23"
blake3 = "1"
bytesize = "2"
bzip2 = "0.6"
chrono = { version = "0.4", default-features = false, features = [
  "std",
  "clock",
  "serde",
] }
ci_info = "0.14"
console = "0.16"
demand = "2"
digest = "0.11"
duct = "1"
dunce = "1"
eyre = "0.6.14"
filetime = "0.2"
flate2 = "1"
fslock = "0.2"
futures-util = "0.3"
gix = { version = "<1", default-features = false, features = [
  "max-performance-safe",
  "worktree-mutation",
  "sha1",
  "sha256",
  "interrupt",
  "auto-chain-error",
] }
globset = "0.4"
heck = "0.5"
hex = "0.4"
homedir = "0.3"
http = "1"
indexmap = { version = "2", features = ["serde"] }
indoc = "2"
itertools = "0.15"
jdx-tar = "1"
jiff = "0.2"
junction = "2"
log = "0.4"
md-5 = "0.11"
mise-agent-env = { path = "../mise-agent-env", version = "0.1" }
mise-cache-core = { path = "../mise-cache-core", version = "0.1", default-features = false }
mise-settings = { path = "../mise-settings", version = "2026" }
mise-sigstore = { path = "../mise-sigstore", version = "0.1", default-features = false }
netrc-rs = "0.1"
nodejs-semver = "5"
nucleo-matcher = "0.3"
num_cpus = "1"
once_cell = "1"
packslip = { version = "1.0", default-features = false }
path-absolutize = "4"
petgraph = "0.8"
pgp = "0.20"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "form",
  "gzip",
  "zstd",
  "charset",
  "http2",
  "socks",
  "stream",
  "system-proxy",
] }
rmp-serde = "1"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sevenz-rust2 = "0.22"
sha1 = "0.11"
sha2 = "0.11"
shell-escape = "0.1"
shell-words = "1"
signal-hook = "0.4"
siphasher = "1"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3"
tera = "2"
tera-contrib = { version = "0.3", features = [
  "base64",
  "date",
  "filesize_format",
  "format",
  "json",
  "rand",
  "regex",
  "slug",
  "urlencode",
] }
tera1 = { package = "tera", version = "1" }
terminal_size = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
toml = { version = "1", features = ["parse", "preserve_order"] }
toml_edit = { version = "0.25", features = ["parse"] }
url = "2"
urlencoding = "2"
versions = { version = "8", features = ["serde"] }
walkdir = "2"
which = "8"
xx = { version = "2", default-features = false, features = ["glob"] }
xz2 = "0.1"
zip = { version = "8", default-features = false, features = ["deflate"] }
zstd = "0.14"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["dir", "fs", "signal", "term", "user"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
confique = { version = "0.4", default-features = false }
ctor = "1"
mockito = "1"
insta = { version = "1", features = ["filters", "json"] }
pretty_assertions = "1"

[features]
default = ["native-tls"]
native-tls = [
  "gix/blocking-http-transport-reqwest-native-tls",
  "mise-sigstore/native-tls",
  "reqwest/native-tls",
]
rustls = [
  "gix/blocking-http-transport-reqwest-rust-tls",
  "mise-sigstore/rustls",
  "reqwest/rustls",
]
rustls-native-roots = [
  "gix/blocking-http-transport-reqwest-rust-tls",
  "mise-sigstore/rustls",
  "reqwest/rustls",
]
