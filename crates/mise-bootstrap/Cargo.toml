license = "MIT"
description = "Bootstrap workflow model for mise"
homepage = "https://github.com/jdx/mise"
repository = "https://github.com/jdx/mise"

[lib]
name = "mise_bootstrap"
path = "src/lib.rs"

[dependencies]
usage_rs = { package = "usage-rs", version = "6.8", default-features = false, features = [
  "spec",
] }
