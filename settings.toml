[task_timings]
deprecated = "Use task.timings instead."
deprecated_remove_at = "2027.2.0"
deprecated_warn_at = "2026.8.0"
description = "Deprecated alias for `task.timings`."
hide = true
optional = true
type = "Bool"

[tera_v1]
default = false
deprecated = "tera_v1 is a temporary compatibility escape hatch for templates that still need Tera v1 behavior. Update templates to Tera v2 syntax instead."
deprecated_remove_at = "2027.4.0"
deprecated_warn_at = "2026.10.0"
description = "[deprecated] Render templates with Tera v1 instead of Tera v2."
docs = """
Use it only for templates that need Tera v1 macros or its lenient handling of
undefined variables. In a shared `mise.toml`, set `MISE_TERA_V1 = true` under
`[env]` instead: older mise releases treat it as an ordinary environment
variable, while they reject an unknown setting. It does not apply to
`.miserc.toml`. See
[Migrating from Tera v1](/templates.html#tera-v2-migration).
"""
env = "MISE_TERA_V1"
type = "Bool"

[terminal_progress]
default = true
description = "Show install progress in the terminal window's own progress indicator, with OSC 9;4 escape sequences."
docs = """
mise sends the sequences only to terminals that support them, such as Ghostty,
iTerm2, VS Code's terminal, Windows Terminal and VTE-based terminals such as
GNOME Terminal and Ptyxis, and not to Alacritty, WezTerm or kitty.
"""
env = "MISE_TERMINAL_PROGRESS"
type = "Bool"

[tool_update.check_duration]
default = "24h"
description = "How often mise checks for a newer version of a global tool that sets `auto_update = true`."
docs = """
A tool can set its own interval instead, such as `auto_update = "6h"`.
Intervals under `1h` are raised to `1h`. See
[Automatic tool updates](/dev-tools/#automatic-tool-updates).
"""
env = "MISE_TOOL_UPDATE_CHECK_DURATION"
global_only = true
type = "Duration"

[trace]
description = "Set the log level to trace."
env = "MISE_TRACE"
hide = true
type = "Bool"

[truncate]
default = true
description = "Truncate long terminal output to fit the available width."
docs = """
Set to `false` to show complete values in output that fits itself to the
terminal, such as table cells and task command lines. Limits on captured
command output, HTTP response bodies and history data still apply. AI coding
agents always get untruncated output. Commands that truncate also accept
`--truncate` and `--no-truncate` for one run.
"""
env = "MISE_TRUNCATE"
type = "Bool"

[trusted_config_paths]
default = []
description = "Directories whose config files mise trusts without asking."
docs = """
Covers config files at or below these paths, including projects you create
there later. `["/"]` trusts every config file, which turns trust checks off.
They override trust prompts you declined and `mise trust --ignore`, but
[`ignored_config_paths`](#ignored_config_paths) still stops configs from
loading. Paranoid mode still trusts these paths, without tying trust to file
contents. See [Trust by path](/security.html#trust-by-path).
"""
env = "MISE_TRUSTED_CONFIG_PATHS"
global_only = true
parse_env = "list_by_os_path_separator"
rust_type = "BTreeSet<PathBuf>"
type = "ListPath"

[unix_default_file_shell_args]
default = "sh"
description = "Shell that runs a file task on Unix when the task sets no `shell` and the file has no shebang or known extension."
docs = """
Applies when mise runs the file through a shell instead of executing it: when
the file is not executable, or when
[`use_file_shell_for_executable_tasks`](#use_file_shell_for_executable_tasks)
is on. mise appends the file path as the last argument.
"""
env = "MISE_UNIX_DEFAULT_FILE_SHELL_ARGS"
global_only = true
type = "String"

[unix_default_inline_shell_args]
default = "sh -o errexit -c"
description = "Shell and arguments that run inline scripts on Unix, such as a task's `run`, hooks and `postinstall`."
docs = "mise appends the script as the last argument. A task's own `shell` takes precedence."
env = "MISE_UNIX_DEFAULT_INLINE_SHELL_ARGS"
global_only = true
type = "String"

[upgrade.auto_prune]
default = true
description = "Remove the version that `mise upgrade` replaced once `upgrade.prune_after` has passed."
docs = """
The old install stays during that grace period, so running processes can keep
loading files from it. Set this to `false` when something outside mise uses
that path for good, such as a virtualenv built from a mise-managed interpreter;
the old version then stays without a scheduled removal.

Versions still used by another tracked config, a tool stub or a running process
are kept, and may be removed up to a day after that use ends.
`mise upgrade --prune` removes the replaced version at once, and `--no-prune`
keeps it without scheduling removal. See
[`upgrade.prune_after`](#upgrade.prune_after).
"""
env = "MISE_UPGRADE_AUTO_PRUNE"
type = "Bool"

[upgrade.prune_after]
default = "24h"
description = "Grace period before mise removes a version that `mise upgrade` replaced."
docs = """
The replaced version stays at its original path for this long, and a later
mise command removes it. This protects long-running commands that still load
files from the old install. Set to `0s` to remove scheduled versions on the
next mise command. Run `mise upgrade --prune` or `mise prune` to remove them in
the current one.
"""
env = "MISE_UPGRADE_PRUNE_AFTER"
type = "Duration"

[url_replacements]
description = "URL patterns and replacements that mise's HTTP client applies before sending a request, for mirrors and proxies."
docs = '''
A plain key matches anywhere in the URL, and every occurrence is replaced. A key
that starts with `regex:` is a Rust regular expression, and its first match is
replaced. Rules apply in order, and the first one that changes the URL wins.
`MISE_URL_REPLACEMENTS` takes the rules as a JSON object.

```toml
[settings.url_replacements]
"https://github.com/" = "https://github-mirror.example.com/"
```

Rerouting `api.github.com`, or a repository's release and attestation API
paths, also stops mise from using [mise-versions](#use_versions_host) for that
GitHub metadata, so it all comes from the replacement. Rerouting only release
downloads does not. See [URL replacements](/url-replacements.html).
'''
env = "MISE_URL_REPLACEMENTS"
optional = true
parse_env = "parse_url_replacements"
type = "IndexMap<String, String>"

[use_file_shell_for_executable_tasks]
default = false
description = "Run executable file tasks through a shell instead of executing them directly."
docs = """
By default, mise runs a file task that the OS can execute as a program. With
this on, mise starts it with a shell, chosen in this order: the task's `shell`,
the file's shebang, its extension (`.ps1` runs with `pwsh -File`), then
[`unix_default_file_shell_args`](#unix_default_file_shell_args) or
[`windows_default_file_shell_args`](#windows_default_file_shell_args).
"""
env = "MISE_USE_FILE_SHELL_FOR_EXECUTABLE_TASKS"
type = "Bool"

[use_versions_host]
default = true
description = "Get version lists, public GitHub release metadata and attestations from mise-versions instead of upstream APIs."
docs = """
[mise-versions](https://mise-versions.jdx.dev) is a shared cache that refreshes
version lists for registry tools and public GitHub release data on a schedule.
Using it avoids GitHub's anonymous rate limit in normal installs, including
Docker builds and CI jobs without a GitHub token.

When the host does not have the requested metadata yet, mise falls back to the
upstream API. Private repositories, GitHub Enterprise, custom GitHub API URLs,
and installs with this setting off need normal
[GitHub authentication](/dev-tools/github-tokens.html) to stay within GitHub's
rate limits.

When [`url_replacements`](#url_replacements) reroutes `api.github.com`, or a
repository's release or attestation API paths, mise does not use this host for
that GitHub metadata; the replacement is the only source, because this host
describes only github.com. Rules that reroute only release downloads do not
change this, and version lists for registry tools still come from this host.

`mise ls-remote --no-versions-host` skips the host for one command. See
[A new release is not listed](/troubleshooting.html#new-version-of-a-tool-is-not-available).
"""
env = "MISE_USE_VERSIONS_HOST"
type = "Bool"

[use_versions_host_track]
default = true
description = "Send anonymous download statistics to mise-versions after installing a tool."
docs = """
After a successful install of a core or registry tool, mise reports it to
[mise-versions](https://mise-versions.jdx.dev), which shows tool popularity.
mise sends:

- the tool name, its full backend identifier such as `aqua:BurntSushi/ripgrep`,
  and the version
- the OS and architecture
- the mise version and invoking shell, in the User-Agent, and whether it runs
  in CI

The server hashes your IP address for daily deduplication and does not store it
raw. Nothing is sent when [`use_versions_host`](#use_versions_host) is `false`.
Set this to `false` to opt out.
"""
env = "MISE_USE_VERSIONS_HOST_TRACK"
type = "Bool"

[verbose]
description = "Show extra output, such as installation logs, and set the log level to debug; same as `--verbose`."
env = "MISE_VERBOSE"
type = "Bool"

[windows_default_file_shell_args]
default = "cmd /c"
description = "Shell that runs a file task on Windows when the task sets no `shell` and the file has no shebang or known extension."
docs = """
Applies when mise runs the file through a shell instead of executing it: when
Windows cannot run the file by itself, or when
[`use_file_shell_for_executable_tasks`](#use_file_shell_for_executable_tasks)
is on. mise appends the file path as the last argument.
"""
env = "MISE_WINDOWS_DEFAULT_FILE_SHELL_ARGS"
global_only = true
type = "String"

[windows_default_inline_shell_args]
default = "cmd /c"
description = "Shell and arguments that run inline scripts on Windows, such as a task's `run`, hooks and `postinstall`."
docs = "mise appends the script as the last argument. A task's own `shell` takes precedence."
env = "MISE_WINDOWS_DEFAULT_INLINE_SHELL_ARGS"
global_only = true
type = "String"

[windows_executable_extensions]
default = ["exe", "bat", "cmd", "com", "ps1", "vbs"]
description = "File extensions, without the dot, that mise treats as executable on Windows."
docs = """
mise tries them in order when it looks up a command name that has no
extension, and a file with one of them counts as a file task. Matching ignores
case.
"""
env = "MISE_WINDOWS_EXECUTABLE_EXTENSIONS"
parse_env = "list_by_comma"
rust_type = "Vec<String>"
type = "ListString"

[windows_powershell_no_profile]
default = true
description = "Pass `-NoProfile` to the PowerShell (`pwsh` or `powershell`) that mise starts, so startup profiles are skipped."
docs = """
This matches `sh -c` and `zsh -c` on Unix, which do not read interactive
startup files. A profile that changes `PATH`, such as one that activates mise
or adds the shims directory, can otherwise shadow a task's own tools and cause
`cannot find binary path` errors.

It applies to tasks, hooks and `watch_files` commands that run through
PowerShell, on any OS, and has no effect on `cmd`, `sh`, `bash` or other
shells. Set it to `false` if your tasks rely on variables, functions or aliases
from your PowerShell profile.
"""
env = "MISE_WINDOWS_POWERSHELL_NO_PROFILE"
type = "Bool"

[windows_shim_mode]
default = "exe"
description = "How mise creates shims on Windows."
docs = """
Use `exe` unless a tool needs one of the others. When `mise-shim.exe` is
missing, mise warns and uses `file`. After mise is upgraded, the next
`mise reshim` rebuilds `exe`, `file` and `hardlink` shims.
"""
enum = [
  { value = "exe", description = "copy `mise-shim.exe` as `<tool>.exe`; works in every shell, with package managers and with `where.exe`, and needs `mise-shim.exe` next to `mise.exe`" },
  { value = "file", description = "write a `.cmd` batch file, plus an extensionless script for Git Bash and Cygwin" },
  { value = "hardlink", description = "create NTFS hard links to `mise.exe`, which must be on the same volume as the shims" },
  { value = "symlink", description = "create symbolic links to `mise.exe`, which needs administrator rights or Developer Mode" },
]
env = "MISE_WINDOWS_SHIM_MODE"
type = "String"

[write_targets.dotfiles]
description = "Global config file where `mise dot add` creates new `[dotfiles]` entries."
docs = """
`mise dot edit` uses it too when it adds an entry. `mise dot track` does not:
it writes new track entries to the global `config.toml`, or to
`conf.d/dotfiles-tracking.toml` when another entry already manages the target.
Existing entries stay in the file that declares them. The path must be absolute
or start with `~/`, and name a file that mise loads from the global config
directory, such as `~/.config/mise/conf.d/30-dotfiles.toml`. See
[Send global writes to separate files](/configuration.html#global-section-write-targets).
"""
global_only = true
optional = true
type = "Path"

[write_targets.packages]
description = "Global config file where `--global` package commands create new `[bootstrap.packages]` entries."
docs = """
Used by `mise bootstrap packages use --global` and
`mise bootstrap packages import --global`. Existing entries stay in the file
that declares them. The path must be absolute or start with `~/`, and name a
file that mise loads from the global config directory, such as
`~/.config/mise/conf.d/20-packages.toml`. See
[Send global writes to separate files](/configuration.html#global-section-write-targets).
"""
global_only = true
optional = true
type = "Path"

[write_targets.tools]
description = "Global config file where `mise use --global` creates new `[tools]` entries."
docs = """
Existing entries stay in the file that declares them. The path must be absolute
or start with `~/`, and name a file that mise loads from the global config
directory, such as `~/.config/mise/conf.d/10-tools.toml`. See
[Send global writes to separate files](/configuration.html#global-section-write-targets).
"""
global_only = true
optional = true
type = "Path"

[yes]
description = "Answer yes to every confirmation prompt, as `--yes` does."
docs = """
Use it in scripts and CI; mise also turns it on when the `CI` environment
variable is set. It also answers the config trust prompt, which records trust,
except in [paranoid mode](/paranoid.html).
"""
env = "MISE_YES"
global_only = true
type = "Bool"

[zig.use_community_mirrors]
default = true
description = "Download Zig from the community mirrors that ziglang.org recommends before trying ziglang.org itself."
docs = """
ziglang.org offers no uptime or speed guarantees and asks automated downloads
to use the [community mirrors](https://ziglang.org/download/community-mirrors/).
Every download is verified against the Zig Software Foundation's signing key,
so a mirror cannot alter it. When every mirror fails, mise downloads from
ziglang.org.

mise refreshes its cached mirror list daily. Without network access to the
list, write one mirror URL per line to `zig/community-mirrors.txt` in the
directory that `mise cache path` prints.
"""
env = "MISE_ZIG_USE_COMMUNITY_MIRRORS"
type = "Bool"
