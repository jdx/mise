env = { STEP = "5" }
run = "echo lint 5"

[tasks."lint:step6"]
description = "lint step 6"
depends = ["lint:step5"]
run = "echo lint 6"

[tasks."lint:step7"]
description = "lint step 7"
depends = ["lint:step6"]
dir = "{{config_root}}/sub"
