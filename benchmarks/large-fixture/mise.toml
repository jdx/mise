# A frozen copy of the tools mise's own repository pins, with its lockfile, so
# the large benchmarks measure a project the size of a real one: 29 tools across
# the aqua, github, packslip, npm and core backends, a lockfile covering every
# platform, and 47 tasks. `setup.sh` fakes an install of every locked version.
# Do not refresh it from the repository config: changing it moves every large
# benchmark's baseline.

[env]
_.path = ["./target/debug", "./node_modules/.bin"]
BENCH_FIXTURE = "large"
CARGO_TERM_COLOR = "always"

[tools]
mr-boxington = { version = "latest", minimum_release_age = "0s" }
tak = { version = "latest", minimum_release_age = "0s" }
age = "latest"
aube = { version = "latest", minimum_release_age = "0s" }
cargo-binstall = "latest"
cargo-deny = { version = "latest", lazy = true }
communique = { version = "latest", minimum_release_age = "0s" }
cargo-insta = "latest"
"aqua:nextest-rs/nextest/cargo-nextest" = "latest"
git-cliff = "latest"
gh = "latest"
hk = { version = "latest", minimum_release_age = "0s" }
jactionlint = "latest"
jouet = "v0.0.4"
jq = "latest"
lua-language-server = "latest"
stylua = "latest"
"npm:markdownlint-cli" = "latest"
oxfmt = "0.74.0"
"npm:ajv-cli" = "latest"
shellcheck = "latest"
shfmt = "latest"
taplo = "latest"
tombi = "latest"
usage = { version = "latest", minimum_release_age = "0s" }
wait-for-gh-rate-limit = { version = "latest", minimum_release_age = "0s" }
sops = "latest"
node = "24"


[tasks."build:step1"]
description = "build step 1"
run = "echo build 1"

[tasks."build:step2"]
description = "build step 2"
depends = ["build:step1"]
run = "echo build 2"

[tasks."build:step3"]
description = "build step 3"
depends = ["build:step2"]
sources = ["src/**/*.rs", "Cargo.toml"]
outputs = ["target/out.txt"]
run = "echo build 3"

[tasks."build:step4"]
description = "build step 4"
depends = ["build:step3"]
run = "echo build 4"

[tasks."build:step5"]
description = "build step 5"
depends = ["build:step4"]
env = { STEP = "5" }
run = "echo build 5"

[tasks."build:step6"]
description = "build step 6"
depends = ["build:step5"]
run = "echo build 6"

[tasks."build:step7"]
description = "build step 7"
depends = ["build:step6"]
dir = "{{config_root}}/sub"
run = "echo build 7"

[tasks."build:step8"]
description = "build step 8"
depends = ["build:step7"]
run = "echo build 8"

[tasks."test:step1"]
description = "test step 1"
run = "echo test 1"

[tasks."test:step2"]
description = "test step 2"
depends = ["test:step1"]
run = "echo test 2"

[tasks."test:step3"]
description = "test step 3"
depends = ["test:step2"]
sources = ["src/**/*.rs", "Cargo.toml"]
outputs = ["target/out.txt"]
run = "echo test 3"

[tasks."test:step4"]
description = "test step 4"
depends = ["test:step3"]
run = "echo test 4"

[tasks."test:step5"]
description = "test step 5"
depends = ["test:step4"]
env = { STEP = "5" }
run = "echo test 5"

[tasks."test:step6"]
description = "test step 6"
depends = ["test:step5"]
run = "echo test 6"

[tasks."test:step7"]
description = "test step 7"
depends = ["test:step6"]
dir = "{{config_root}}/sub"
run = "echo test 7"

[tasks."test:step8"]
description = "test step 8"
depends = ["test:step7"]
run = "echo test 8"

[tasks."lint:step1"]
