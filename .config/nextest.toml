[profile.default]
# nextest runs every test in its own process, and each process uses the home
# directory of its slot (`mise_util::testing::slot_home`: `test/home/<slot>`
# for mise, `crates/<crate>/test/<slot>` for the crates with their own harness),
# so tests that run at the same time do not share files.
test-threads = "num-cpus"
slow-timeout = { period = "250ms", terminate-after = 4 }
status-level = "all"
retries = { backoff = "exponential", count = 4, delay = "1s", max-delay = "10s" }

# This test checks that the remote cache client waits as long as `Retry-After`
# asks, and one second is the shortest wait that header can express, so the
# test sleeps for the whole ordinary ceiling by design.
[[profile.default.overrides]]
filter = 'package(mise-cache-core) & test(tests::retries_wait_for_retry_after)'
slow-timeout = { period = "1s", terminate-after = 3 }

# The first of these reads every Rust source file in the repository and the
# second parses three lists of a few megabytes under a counting allocator, so
# their cost grows with the source tree and with the size of those lists. Both
# take about 0.9s on the dedicated CI runner with nothing else running, which
# leaves no margin under the ordinary ceiling once other tests share the CPUs.
# That holds for every profile, since they all run tests at the same time.
[[profile.default.overrides]]
filter = 'test(errors::docs_reference::quoted_messages_are_in_the_source) | test(backend::asset_matcher::tests::test_checksum_list_parsing_does_not_copy_the_list)'
slow-timeout = { period = "500ms", terminate-after = 4 }

[profile.ci]
inherits = "default"
# Once every few runs the macOS runner stalls a single test process for 1-3s.
# It hits a different test each time, usually one that finishes in ~10ms, and
# the 1s ceiling kills it. One retry absorbs the stall: a test whose own work
# is over budget still times out on both attempts and fails, and a test that
# passes only on retry is still listed as FLAKY in the summary.
retries = { backoff = "fixed", count = 1, delay = "1s" }

# These tests construct, render, or traverse the entire CLI command graph. Keep
# their regression coverage in-process, but still enforce a strict per-test ceiling.
[[profile.ci.overrides]]
filter = 'test(/cli::((command_effects|mcp|usage)::tests|docs_commands)::/)'
slow-timeout = { period = "500ms", terminate-after = 4 }

# This binary-level integration test performs a network-backed, first-run
# node-gyp bootstrap, so keep a bounded but realistic cold-cache ceiling.
[[profile.ci.overrides]]
filter = 'test(mise_binary_services_aube_node_gyp_bootstrap_trampoline)'
slow-timeout = { period = "5s", terminate-after = 6 }

# This test parses the whole vendored aqua registry, so its cost grows with that
# file rather than with anything the test does. It runs in ~0.6s on the fastest
# runner available, leaving under 2x margin against the ordinary ceiling — the
# tightest in the suite, and why it was the first to die on slower hosts.
[[profile.ci.overrides]]
filter = 'test(aqua::aqua_registry_wrapper::tests::parses_bundled_registry_from_local_source)'
slow-timeout = { period = "1s", terminate-after = 4 }

# This test parses and schema-validates every mise config in docs/ and every
# one an e2e test writes, a few thousand documents, so its cost grows with those
# trees rather than with anything the test does. It spreads the work over the
# available cores and runs in ~0.25s on 32 cores, but a runner with few cores
# needs more than the ordinary ceiling.
[[profile.ci.overrides]]
filter = 'test(config::config_file::mise_toml::schema_conformance::schema_matches_parser)'
slow-timeout = { period = "1s", terminate-after = 4 }

# This protocol regression test streams a sparse body just over 64 MiB through
# a local registry. Keep the normal suite ceiling for every other OCI test,
# but leave a bounded budget for slower macOS runners to drain that deliberate
# full-size request.
[[profile.ci.overrides]]
filter = 'package(mise-oci) & test(registry::tests::large_blob_uses_one_content_range_free_patch)'
slow-timeout = { period = "1s", terminate-after = 5 }

# These tests compose trees, repositories and package state by shelling out,
# so their cost is a few hundred git (or apt) subprocesses rather than anything
# this process computes, and it tracks the host's fork/exec speed. The spread is
# wide: the slowest runs in 0.24s on the dedicated CI runner and 3.2s in a local
# dev container, so the default ceiling fails it off-CI while catching nothing.
# Give the whole family a budget that reflects that without letting a genuine
# hang through. This covers 181 of ~4090 tests; everything else keeps the strict
# ceiling above.
[[profile.ci.overrides]]
filter = 'test(/^git::tests::/) | (package(mise-system) & test(/^(history::|remote_repository::)/)) | (package(mise-system-packages) & test(/^apt::/))'
slow-timeout = { period = "2s", terminate-after = 4 }

# This test runs the real brew shim, which creates a Python venv and runs pip
# once per resource (each in its own build environment). That is process
# start-up cost, a few seconds on a loaded runner, not anything the test computes.
[[profile.ci.overrides]]
filter = 'package(mise-system-packages) & test(brew::source::tests::shim_virtualenv_install_with_resources)'
slow-timeout = { period = "5s", terminate-after = 4 }

# These macOS tests write preferences through cfprefsd and then wait for it to
# write the plist to disk, which it does shortly after the write returns. Give
# the wait a real budget instead of racing the one-second ceiling.
[[profile.ci.overrides]]
filter = '(package(mise-system) & test(/^defaults::tests::test_(sandboxed_round_trip_writes_container|host_uuid_names_core_foundation_byhost_files)$/))'
slow-timeout = { period = "1s", terminate-after = 3 }

# unit-macos runs on two very different machines: a dedicated Namespace runner
# for trusted pushes and PRs, and a shared GitHub-hosted `macos-14` for everyone
# else. The same suite takes 121s on the former and 263s on the latter, so the
# ceilings above — calibrated on the dedicated runner — killed tests that were
# merely running on a slower host, and every outside contributor's PR failed.
#
# This profile keeps the reporting but drops `terminate-after`, so a slow test is
# logged and not killed. The period is the trusted ceiling (250ms x 4), which
# makes the first SLOW line mark exactly the tests that would have failed there.
# nextest does inherit `overrides` from `ci`, so the catch-all override below is
# what keeps those per-test ceilings from killing tests on this profile.
# A genuine hang is still bounded by the job's `timeout-minutes`.
[profile.ci-shared]
inherits = "ci"
slow-timeout = { period = "1s" }

[[profile.ci-shared.overrides]]
filter = 'all()'
slow-timeout = { period = "1s" }
