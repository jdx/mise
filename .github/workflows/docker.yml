name: docker

# Three kinds of image come out of this workflow:
#
# - Release images (`images` job): built from the signed release assets when a
#   GitHub release is published. `ghcr.io/jdx/mise:<version>` is a scratch image
#   holding the static musl binary; `<version>-debian` is a runnable Debian slim
#   image with the glibc binary. Both are also pushed to Docker Hub as
#   jdxcode/mise.
# - The `dev` image (`dockerhub` + `merge` jobs): the historical image built from
#   source on top of the rust image with node and python preinstalled. It is
#   only kept for mise-versions and other internal consumers.
# - Packaging images (`docker` job): alpine/deb/rpm/copr builders and the e2e
#   test environment.

on:
  push:
    tags: ["v[0-9]*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the release images for, e.g. v2026.9.11. Leave empty to rebuild the dev and packaging images from this ref instead."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GITHUB_API_TOKEN: ${{ secrets.MISE_GH_TOKEN || github.token }}

jobs:
  images:
    name: images-${{ matrix.flavor }}
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    # Serialize publishes per flavor so two releases cannot interleave their
    # tag updates; the floating-tag check below handles ordering.
    concurrency:
      group: docker-images-${{ matrix.flavor }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: scratch
            asset_suffix: -musl
            tag_suffix: ""
            floating_tag: latest
          - flavor: debian
            asset_suffix: ""
            tag_suffix: -debian
            floating_tag: debian
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          # The tag reaches shell expansions and Docker tags below, so accept
          # only the mise release format.
          if ! [[ "$TAG" =~ ^v20[0-9]{2}\.[0-9]{1,2}\.[0-9]+$ ]]; then
            echo "::error::Unexpected release tag: $TAG" >&2
            exit 1
          fi
          version="${TAG#v}"
          minor="${version%.*}"
          # Only the newest release may move the floating tags, and only the
          # newest release of a month may move that month's tag. A delayed
          # release event or a manual rebuild of an older tag then republishes
          # its immutable version tag without pulling `latest` backwards.
          # Compare versions numerically: GitHub's /releases/latest and list
          # order follow publish time, so a draft finished late would otherwise
          # count as newest. mise release tags are always vYYYY.M.P, which the
          # check above enforces, so a numeric sort is exact here.
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          versions="$( { grep -E '^v20[0-9]{2}\.[0-9]{1,2}\.[0-9]+$' <<< "$releases" || true; echo "$TAG"; } \
            | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n)"
          newest="$(tail -n1 <<< "$versions")"
          newest_in_minor="$(grep -x "${minor//./\\.}\.[0-9]*" <<< "$versions" | tail -n1)"
          is_latest=false
          is_newest_in_minor=false
          [[ "$newest" == "$version" ]] && is_latest=true
          [[ "$newest_in_minor" == "$version" ]] && is_newest_in_minor=true
          echo "newest release: $newest; newest in $minor: $newest_in_minor"
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "minor=$minor"
            echo "is_latest=$is_latest"
            echo "is_newest_in_minor=$is_newest_in_minor"
          } >> "$GITHUB_OUTPUT"
      - name: Download and verify release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          mkdir -p release context/linux-amd64 context/linux-arm64
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern SHASUMS256.txt \
            --pattern SHASUMS256.txt.minisig \
            --pattern "mise-$TAG-linux-x64$ASSET_SUFFIX" \
            --pattern "mise-$TAG-linux-arm64$ASSET_SUFFIX"
          # minisign.pub holds the release key on its second line.
          minisign -Vm release/SHASUMS256.txt -x release/SHASUMS256.txt.minisig \
            -P "$(sed -n 2p minisign.pub)"
          cd release
          grep -E " \./mise-$TAG-linux-(x64|arm64)$ASSET_SUFFIX\$" SHASUMS256.txt > expected.txt
          test "$(wc -l < expected.txt)" -eq 2
          sha256sum -c --strict expected.txt
          install -m 755 "mise-$TAG-linux-x64$ASSET_SUFFIX" ../context/linux-amd64/mise
          install -m 755 "mise-$TAG-linux-arm64$ASSET_SUFFIX" ../context/linux-arm64/mise
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: jdxcode
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The debian flavor runs apt-get for arm64; the scratch flavor only copies
      # files and would build without emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            jdxcode/mise
            ghcr.io/jdx/mise
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}${{ matrix.tag_suffix }}
            type=raw,value=${{ steps.release.outputs.minor }}${{ matrix.tag_suffix }},enable=${{ steps.release.outputs.is_newest_in_minor }}
            type=raw,value=${{ matrix.floating_tag }},enable=${{ steps.release.outputs.is_latest }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: context
          file: packaging/${{ matrix.flavor }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Inspect and smoke test
        env:
          IMAGE: ghcr.io/jdx/mise:${{ steps.release.outputs.version }}${{ matrix.tag_suffix }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE"
          docker run --rm --entrypoint /usr/local/bin/mise "$IMAGE" --version | tee /dev/stderr | grep -F "$VERSION"

  docker:
    name: docker-${{ matrix.flavor }}
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - alpine
          - deb
          - e2e
          - rpm
          - copr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ghcr.io/jdx/mise:${{ matrix.flavor }}
          labels: ${{ steps.meta.outputs.labels }}
          file: packaging/${{ matrix.flavor }}/Dockerfile
  dockerhub:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            tag_suffix: amd64
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            tag_suffix: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Prepare
        run: |
          platform="${{ matrix.platform.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            jdxcode/mise
            ghcr.io/jdx/mise
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: jdxcode
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          platforms: ${{ matrix.platform.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=jdxcode/mise,ghcr.io/jdx/mise",push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  merge:
    runs-on: ubuntu-latest
    needs: [dockerhub]
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: jdxcode
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: jdx
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Create the dev manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # The per-platform images were pushed by digest only, so the tag in
          # the source references is irrelevant; the digest selects the image.
          # shellcheck disable=SC2046
          docker buildx imagetools create -t jdxcode/mise:dev \
            $(printf "jdxcode/mise@sha256:%s " *)
          # shellcheck disable=SC2046
          docker buildx imagetools create -t ghcr.io/jdx/mise:dev \
            $(printf "ghcr.io/jdx/mise@sha256:%s " *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect jdxcode/mise:dev
          docker buildx imagetools inspect ghcr.io/jdx/mise:dev
