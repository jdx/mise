# Finish a draft GitHub release that already has its build assets uploaded.
# Used when attest/packslip/publish were skipped (for example after a tag
# publish skipped e2e and the default success() gate blocked downstream jobs).
#
# Dispatch from main or a branch that has this workflow:
#   gh workflow run finish-draft-release.yml -f tag=v2026.9.2
name: finish-draft-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft release tag to finish (e.g. v2026.9.2)"
        required: true
        type: string

concurrency:
  group: finish-draft-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GITHUB_API_TOKEN: ${{ secrets.MISE_GH_TOKEN || secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.MISE_GH_TOKEN || secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.MISE_GH_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      release-id: ${{ steps.resolve.outputs.release-id }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *)
              echo "::error::tag must look like v2026.9.2, got: $TAG"
              exit 1
              ;;
          esac
          RELEASE="$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" |
            jq -s -c --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)][0] // empty')"
          if [[ -z "$RELEASE" || "$RELEASE" == "null" ]]; then
            echo "::error::No release found for $TAG"
            exit 1
          fi
          DRAFT="$(jq -r '.draft' <<< "$RELEASE")"
          if [[ "$DRAFT" != "true" ]]; then
            echo "::error::Release $TAG is not a draft (draft=$DRAFT)"
            exit 1
          fi
          RELEASE_ID="$(jq -r '.id' <<< "$RELEASE")"
          test -n "$RELEASE_ID"
          echo "release-id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Finishing draft $TAG (id=$RELEASE_ID)"

  attest-release:
    needs: resolve
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download draft release assets
        env:
          GH_TOKEN: ${{ secrets.MISE_GH_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG" --dir release-assets
          test -f release-assets/SHASUMS256.txt
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-assets/SHASUMS256.txt
      - name: Stage release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 1

  packslip:
    needs:
      - resolve
      - attest-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
      GITHUB_API_TOKEN: ""
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: release-assets
      - name: Generate the CLI specification and completions
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          mkdir -p bin
          tar -xzf "release-assets/mise-$TAG-linux-x64.tar.gz" -C bin
          bin/mise/bin/mise usage > mise.usage.kdl
          for shell in bash zsh fish powershell; do
            bin/mise/bin/mise completion "$shell" > "mise.$shell"
            test -s "mise.$shell"
            grep -Fq '__complete_word__' "mise.$shell"
            bin/mise/bin/mise __complete_word__ --shell "$shell" --line 'mise ins' | grep -Fq -- 'install'
          done
          bash -n mise.bash
      - name: Publish the CLI specification and completions
        env:
          GH_TOKEN: ${{ secrets.MISE_GH_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release upload "$TAG" mise.usage.kdl mise.bash mise.zsh mise.fish mise.powershell --clobber
      - uses: jdx/packslip@a0d434ad57571c62dbd0ab5095b4eff607a71fd3 # v1.1.1
        with:
          artifacts: release-assets/mise-*
          bin: mise
          tag: ${{ needs.resolve.outputs.tag }}
          resources: |
            man@linux=archive:mise/man/man1/mise.1
            man@darwin=archive:mise/man/man1/mise.1
            cli-spec/usage=asset:mise.usage.kdl
            completion/bash=asset:mise.bash
            completion/zsh=asset:mise.zsh
            completion/fish=asset:mise.fish
            completion/powershell=asset:mise.powershell
          attest: "false"
          out: "."
          token: ${{ secrets.MISE_GH_TOKEN }}
      - name: Stage the packslip for the asset check
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-extras
          path: |
            mise.usage.kdl
            mise.bash
            mise.zsh
            mise.fish
            mise.powershell
            packslip.sigstore.json
          if-no-files-found: error
          retention-days: 1

  publish-release:
    needs:
      - resolve
      - attest-release
      - packslip
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: release-assets
      - name: Download the packslip
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-extras
          path: release-assets
      - name: Verify and publish GitHub Release
        run: |
          (cd release-assets && sha256sum ./* | sort) > /tmp/expected-assets
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '.assets[] | select(.digest | startswith("sha256:")) | "\(.digest[7:])  ./\(.name)"' \
            | sort > /tmp/draft-assets
          diff -u /tmp/expected-assets /tmp/draft-assets
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false
        env:
          GH_TOKEN: ${{ secrets.MISE_GH_TOKEN }}
          RELEASE_ID: ${{ needs.resolve.outputs.release-id }}
