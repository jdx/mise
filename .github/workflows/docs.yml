name: docs

on:
  release:
    types: [published]
  push:
    paths: &docs-paths
      - ".github/actions/**"
      - ".github/workflows/docs.yml"
      - ".github/workflows/docs-impl.yml"
      - "aube-lock.yaml"
      - "aube-workspace.yaml"
      - "docs/**"
      - "mise.toml"
      - "package.json"
      - "registry/**"
      - "schema/**"
      - "settings.toml"
      - "tasks.toml"
      - "tasks/docs/**"
      - "xtasks/docs/**"
    branches: [main]
  pull_request:
    paths: *docs-paths
    branches: [main]
  workflow_dispatch:
    inputs:
      rerender-showreel:
        description: Record the landing-page showreel's captures and render it again, even if the cache has them
        type: boolean
        default: false
      deploy:
        description: Publish the docs site to production (main branch only)
        type: boolean
        default: false

permissions: {}

jobs:
  trusted:
    if: ${{ github.event_name == 'release' || ((github.actor == 'jdx' || github.actor == 'mise-en-dev') && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.user.login == 'jdx' || github.event.pull_request.user.login == 'mise-en-dev')))) }}
    permissions:
      contents: read
    uses: $/.github/workflows/docs-impl.yml
    with:
      trusted: true
      rerender-showreel: ${{ inputs.rerender-showreel || false }}
      deploy: ${{ (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main') }}
    secrets:
      CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
      CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
      MISE_GH_TOKEN: ${{ secrets.MISE_GH_TOKEN }}

  untrusted:
    if: ${{ github.event_name != 'release' && ((github.actor != 'jdx' && github.actor != 'mise-en-dev') || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || (github.event.pull_request.user.login != 'jdx' && github.event.pull_request.user.login != 'mise-en-dev')))) }}
    permissions:
      contents: read
    uses: $/.github/workflows/docs-impl.yml
    with:
      trusted: false

  docs:
    name: docs
    if: ${{ always() && !cancelled() && github.repository == 'jdx/mise' && needs.trusted.result != 'cancelled' && needs.untrusted.result != 'cancelled' }}
    permissions: {}
    needs: [trusted, untrusted]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check selected workflow result
        env:
          TRUSTED_RESULT: ${{ needs.trusted.result }}
          UNTRUSTED_RESULT: ${{ needs.untrusted.result }}
        run: |
          if [[ "$TRUSTED_RESULT" == success && "$UNTRUSTED_RESULT" == skipped ]] ||
             [[ "$TRUSTED_RESULT" == skipped && "$UNTRUSTED_RESULT" == success ]]; then
            exit 0
          fi
          echo "trusted=$TRUSTED_RESULT untrusted=$UNTRUSTED_RESULT"
          exit 1
