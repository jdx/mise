name: test
on:
  push:
    tags: ["v*"]
    branches: ["mise", "release"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  MISE_EXPERIMENTAL: 1
  MISE_LOCKFILE: 1
  RUST_BACKTRACE: 1
  MISE_GITHUB_TOKEN: ${{ secrets.MISE_GH_TOKEN || secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.MISE_GH_TOKEN || secrets.GITHUB_TOKEN }}
  FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}

permissions:
  contents: read

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full-ci: ${{ steps.classify.outputs.full-ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify changes
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "full-ci=true" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            exit 0
          fi

          changed=0
          while IFS= read -r path; do
            changed=1
            case "$path" in
              docs/* | *.md) ;;
              *) exit 0 ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          if [ "$changed" -eq 1 ]; then
            echo "full-ci=false" >> "$GITHUB_OUTPUT"
          fi

  build-ubuntu:
    runs-on: namespace-profile-endev-linux-amd64;overrides.cache-tag=mise-pr-rust-linux
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.global-cache
            ~/.cache/sccache
      - uses: taiki-e/install-action@51cd0b8c0499559d9a4d75c0f5c67bec3a894ec8 # v2
        with: { tool: sccache }
      - name: Configure sccache
        run: |
          export RUSTC_WRAPPER=sccache
          export SCCACHE_DIR="$HOME/.cache/sccache"
          export SCCACHE_CACHE_SIZE=20G
          {
            echo "RUSTC_WRAPPER=$RUSTC_WRAPPER"
            echo "SCCACHE_DIR=$SCCACHE_DIR"
            echo "SCCACHE_CACHE_SIZE=$SCCACHE_CACHE_SIZE"
          } >> "$GITHUB_ENV"
          sccache --zero-stats
      - run: |
          cargo build --all-features
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
      - run: mise -v
      # Downstream jobs only execute this binary, so keep full debug symbols in
      # the build job while transferring a much smaller stripped copy.
      - name: Prepare mise artifact
        run: |
          install -Dm755 target/debug/mise target/ci-artifacts/mise
          strip --strip-debug target/ci-artifacts/mise
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mise-ubuntu-latest
          path: target/ci-artifacts/mise
      - run: sccache --show-stats
        if: always()

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [classify-changes]
    if: needs.classify-changes.outputs.full-ci == 'true'
    env:
      MISE_DATA_DIR: ~/.local/share/mise
      MISE_CACHE_DIR: ~/.cache/mise
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 # zizmor: ignore[cache-poisoning] save-if already gates writes to main/release
        with:
          shared-key: build
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release' }}
      - shell: pwsh
        run: |
          cargo build --no-default-features --features rustls-native-roots,vfox/vendored-lua,self_update
          cargo build -p mise-shim
          Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\target\debug"
      - parallel:
          - run: mise -v
          - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
            with:
              name: mise-windows-latest
              path: |
                target/debug/mise.exe
                target/debug/mise-shim.exe

  unit:
    name: unit-macos
    runs-on: namespace-profile-endev-macos-arm64;overrides.cache-tag=mise-pr-rust-macos
    timeout-minutes: 90
    needs: [classify-changes]
    if: needs.classify-changes.outputs.full-ci == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
      - uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.global-cache
            ~/.cache/sccache
      - uses: taiki-e/install-action@51cd0b8c0499559d9a4d75c0f5c67bec3a894ec8 # v2
        with: { tool: sccache }
      - name: Configure sccache
        run: |
          export RUSTC_WRAPPER=sccache
          export SCCACHE_DIR="$HOME/.cache/sccache"
          export SCCACHE_CACHE_SIZE=20G
          {
            echo "RUSTC_WRAPPER=$RUSTC_WRAPPER"
            echo "SCCACHE_DIR=$SCCACHE_DIR"
            echo "SCCACHE_CACHE_SIZE=$SCCACHE_CACHE_SIZE"
          } >> "$GITHUB_ENV"
          sccache --zero-stats
      - name: Install fd
        run: brew install fd
      - run: |
          cargo build --all-features
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
      - uses: ./.github/actions/mise-tools
      - run: mise x -- cargo test --all-features
      # `cargo test` above resolves to the root package, so the workspace members are built as
      # dependencies but never tested. Run them separately rather than adding --workspace to the
      # line above, which would extend --all-features to members whose features are exclusive.
      - name: cargo test (workspace members)
        run: cargo test --workspace --exclude mise
      - run: sccache --show-stats
        if: always()

  brew-oracle-macos:
    runs-on: namespace-profile-endev-macos-arm64;overrides.cache-tag=mise-pr-rust-macos
    timeout-minutes: 45
    needs: [classify-changes]
    # Always start the proof job once classification says this is full CI. It
    # builds the immutable PR head itself, so another job cannot skip its proof.
    if: always() && needs.classify-changes.outputs.full-ci == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.global-cache
            ~/.cache/sccache
      - uses: taiki-e/install-action@51cd0b8c0499559d9a4d75c0f5c67bec3a894ec8 # v2
        with: { tool: sccache }
      - name: Build exact-head oracle binary
        run: |
          export RUSTC_WRAPPER=sccache
          export SCCACHE_DIR="$HOME/.cache/sccache"
          cargo build --all-features
          strip -S target/debug/mise
      - name: Prepare exact-head oracle environment
        run: |
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/mise-brew-oracle-results"
          test ! -L "$RUNNER_TEMP/mise-brew-oracle-results"
          {
            echo "mise_sha=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "platform=$(uname -s)-$(uname -m)"
            echo "homebrew_version=$(brew --version | head -1)"
            echo "tests=test_system_install_brew_macos_slow,test_system_install_brew_formula_lifecycle_macos_slow"
          } > "$RUNNER_TEMP/mise-brew-oracle-results/job-context.txt"
      - name: Run cask oracle
        env:
          MISE_BREW_ORACLE_DISPOSABLE: "1"
          MISE_BREW_ORACLE_RESULT_DIR: ${{ runner.temp }}/mise-brew-oracle-results
          MISE_BREW_ORACLE_RUNNER_TEMP: ${{ runner.temp }}
          MISE_BREW_ORACLE_MISE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MISE_BREW_ORACLE_UNFORWARDED: must-not-leak
          MISE_DISABLE_TOOLS: "1"
          MISE_AUTO_INSTALL: "false"
        run: mise run test:e2e e2e/cli/test_system_install_brew_macos_slow
      - name: Run canonical formula lifecycle oracle
        env:
          MISE_BREW_ORACLE_DISPOSABLE: "1"
          MISE_BREW_ORACLE_RESULT_DIR: ${{ runner.temp }}/mise-brew-oracle-results
          MISE_BREW_ORACLE_RUNNER_TEMP: ${{ runner.temp }}
          MISE_BREW_ORACLE_MISE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MISE_BREW_ORACLE_UNFORWARDED: must-not-leak
          MISE_BREW_LIFECYCLE_TEST_PREFIX: /opt/homebrew
          MISE_DISABLE_TOOLS: "1"
          MISE_AUTO_INSTALL: "false"
        run: mise run test:e2e e2e/cli/test_system_install_brew_formula_lifecycle_macos_slow
      - name: Verify oracle completion records
        if: always()
        env:
          MISE_BREW_ORACLE_MISE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          source e2e/cli/brew_oracle_guard.sh
          result_dir="$RUNNER_TEMP/mise-brew-oracle-results"
          brew_oracle_verify_marker \
            "$result_dir/macos-cask.completed" \
            test_system_install_brew_macos_slow 1 /opt/homebrew \
            "$MISE_BREW_ORACLE_MISE_SHA"
          brew_oracle_verify_marker \
            "$result_dir/macos-formula-lifecycle.completed" \
            test_system_install_brew_formula_lifecycle_macos_slow 4 /opt/homebrew \
            "$MISE_BREW_ORACLE_MISE_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: brew-oracle-macos-results
          path: ${{ runner.temp }}/mise-brew-oracle-results
          if-no-files-found: error

  brew-oracle-linux:
    runs-on: namespace-profile-endev-linux-amd64;overrides.cache-tag=mise-pr-rust-linux
    timeout-minutes: 30
    needs: [classify-changes]
    if: always() && needs.classify-changes.outputs.full-ci == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.global-cache
            ~/.cache/sccache
      - uses: taiki-e/install-action@51cd0b8c0499559d9a4d75c0f5c67bec3a894ec8 # v2
        with: { tool: sccache }
      - name: Build exact-head oracle binary
        run: |
          export RUSTC_WRAPPER=sccache
          export SCCACHE_DIR="$HOME/.cache/sccache"
          cargo build --all-features
          strip --strip-debug target/debug/mise
      - name: Prepare exact-head oracle environment
        run: |
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/mise-brew-oracle-results"
          test ! -L "$RUNNER_TEMP/mise-brew-oracle-results"
          {
            echo "mise_sha=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "platform=$(uname -s)-$(uname -m)"
            echo "test=test_system_install_brew_linux"
          } > "$RUNNER_TEMP/mise-brew-oracle-results/job-context.txt"
      - name: Run Linux formula oracle
        env:
          MISE_BREW_ORACLE_DISPOSABLE: "1"
          MISE_BREW_ORACLE_RESULT_DIR: ${{ runner.temp }}/mise-brew-oracle-results
          MISE_BREW_ORACLE_RUNNER_TEMP: ${{ runner.temp }}
          MISE_BREW_ORACLE_MISE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MISE_BREW_ORACLE_UNFORWARDED: must-not-leak
          MISE_DISABLE_TOOLS: "1"
          MISE_AUTO_INSTALL: "false"
        run: |
          sudo env \
            PATH="$PATH" \
            CI=true \
            MISE_BREW_ORACLE_DISPOSABLE="$MISE_BREW_ORACLE_DISPOSABLE" \
            MISE_BREW_ORACLE_RESULT_DIR="$MISE_BREW_ORACLE_RESULT_DIR" \
            MISE_BREW_ORACLE_RUNNER_TEMP="$MISE_BREW_ORACLE_RUNNER_TEMP" \
            MISE_BREW_ORACLE_MISE_SHA="$MISE_BREW_ORACLE_MISE_SHA" \
            MISE_BREW_ORACLE_UNFORWARDED="$MISE_BREW_ORACLE_UNFORWARDED" \
            MISE_DISABLE_TOOLS="$MISE_DISABLE_TOOLS" \
            MISE_AUTO_INSTALL="$MISE_AUTO_INSTALL" \
            MISE_E2E_DOCKER=0 \
            mise run test:e2e e2e/cli/test_system_install_brew_linux
      - name: Verify oracle completion record
        if: always()
        env:
          MISE_BREW_ORACLE_MISE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          source e2e/cli/brew_oracle_guard.sh
          brew_oracle_verify_marker \
            "$RUNNER_TEMP/mise-brew-oracle-results/linux-formula.completed" \
            test_system_install_brew_linux 1 /home/linuxbrew/.linuxbrew \
            "$MISE_BREW_ORACLE_MISE_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: brew-oracle-linux-results
          path: ${{ runner.temp }}/mise-brew-oracle-results
          if-no-files-found: error

  nightly:
    runs-on: namespace-profile-endev-linux-amd64;overrides.cache-tag=mise-pr-rust-linux-nightly
    timeout-minutes: 15
    # Track rolling nightly for early rustc regressions without blocking PRs on upstream compiler ICEs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
      - run: rustup default nightly
      - uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.global-cache
            ~/.cache/sccache
      - uses: taiki-e/install-action@51cd0b8c0499559d9a4d75c0f5c67bec3a894ec8 # v2
        with: { tool: sccache }
      - name: Configure sccache
        run: |
          export RUSTC_WRAPPER=sccache
          export SCCACHE_DIR="$HOME/.cache/sccache"
          export SCCACHE_CACHE_SIZE=20G
          {
            echo "RUSTC_WRAPPER=$RUSTC_WRAPPER"
            echo "SCCACHE_DIR=$SCCACHE_DIR"
            echo "SCCACHE_CACHE_SIZE=$SCCACHE_CACHE_SIZE"
          } >> "$GITHUB_ENV"
          sccache --zero-stats
      - run: cargo test --all-features
      - run: sccache --show-stats
        if: always()

  lint:
    runs-on: namespace-profile-endev-linux-amd64;overrides.cache-tag=mise-pr-rust-linux
    timeout-minutes: 80
    needs: [build-ubuntu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - parallel:
          - name: Install mold
            run: sudo apt-get update && sudo apt-get install -y mold
          - uses: taiki-e/install-action@51cd0b8c0499559d9a4d75c0f5c67bec3a894ec8 # v2
            with:
              tool: cargo-deny,cargo-msrv,cargo-machete,sccache
          - uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
            with:
              path: |
                ~/.cargo/registry
                ~/.cargo/git
                ~/.cargo/.global-cache
                ~/.cache/sccache
          - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
            with:
              name: mise-ubuntu-latest
              path: target/debug
      - name: Configure sccache
        run: |
          export RUSTC_WRAPPER=sccache
          export SCCACHE_DIR="$HOME/.cache/sccache"
          export SCCACHE_CACHE_SIZE=20G
          {
            echo "RUSTC_WRAPPER=$RUSTC_WRAPPER"
            echo "SCCACHE_DIR=$SCCACHE_DIR"
            echo "SCCACHE_CACHE_SIZE=$SCCACHE_CACHE_SIZE"
          } >> "$GITHUB_ENV"
          sccache --zero-stats
      - run: echo "$PWD/target/debug" >> "$GITHUB_PATH" && chmod +x target/debug/mise
      - uses: ./.github/actions/mise-tools
      - run: mise x -- bun i
      # build-ubuntu produced this commit's binary, downloaded above.
      - run: mise run render
        env:
          MISE_TASK_SKIP: build
      - name: assert render produces no diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::'mise run render' produced changes. Run it locally and commit."
            git status
            git diff HEAD
            exit 1
          fi
      # Keep these independent checks on one Namespace runner while overlapping
      # their work. Clippy is stricter than HK's cargo-check, so CI can skip that
      # redundant compilation while retaining it for local lint runs.
      - parallel:
          - run: rm -rf ~/.cargo/advisory-dbs && cargo deny check
          - run: cargo machete --with-metadata
          - run: ./scripts/test-standalone.sh
          - run: mise run lint
            env:
              HK_SKIP_STEPS: cargo-check
          # MSRV uses a separate target directory so its older compiler cannot
          # invalidate stable's build artifacts.
          - name: Verify MSRV
            run: cargo msrv verify
            env:
              CARGO_TARGET_DIR: target/msrv
          - name: Run Clippy
            run: |
              cargo clippy -- -D warnings
              cargo clippy --all-features --all-targets -- -D warnings
      - run: sccache --show-stats
        if: always()

  e2e:
    name: e2e
    # The release PR runs the full suite against the packaged release tarball.
    # Keep that stronger signal instead of also testing the debug artifact.
    if: ${{ needs.classify-changes.outputs.full-ci == 'true' && (github.event_name != 'pull_request' || github.head_ref != 'release' || github.base_ref != 'main') }}
    runs-on: namespace-profile-endev-linux-amd64;overrides.cache-tag=mise-pr-rust-linux
    needs: [build-ubuntu, classify-changes]
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Fetch sequentially so the pool can rotate its cursor between requests.
      # Each token is also rejected by the action when its core budget is empty.
      - name: Fetch token 0
        id: token_0
        uses: ./.github/actions/fetch-token
        with:
          api-secret: ${{ secrets.MISE_VERSIONS_API_SECRET }}
      - name: Fetch token 1
        id: token_1
        uses: ./.github/actions/fetch-token
        with:
          api-secret: ${{ secrets.MISE_VERSIONS_API_SECRET }}
      - name: Fetch token 2
        id: token_2
        uses: ./.github/actions/fetch-token
        with:
          api-secret: ${{ secrets.MISE_VERSIONS_API_SECRET }}
      - name: Fetch token 3
        id: token_3
        uses: ./.github/actions/fetch-token
        with:
          api-secret: ${{ secrets.MISE_VERSIONS_API_SECRET }}
      - name: Fetch token 4
        id: token_4
        uses: ./.github/actions/fetch-token
        with:
          api-secret: ${{ secrets.MISE_VERSIONS_API_SECRET }}
      - name: Fetch token 5
        id: token_5
        uses: ./.github/actions/fetch-token
        with:
          api-secret: ${{ secrets.MISE_VERSIONS_API_SECRET }}
      - name: Fetch token 6
        id: token_6
        uses: ./.github/actions/fetch-token
        with:
          api-secret: ${{ secrets.MISE_VERSIONS_API_SECRET }}
      - name: Fetch token 7
        id: token_7
        uses: ./.github/actions/fetch-token
        with:
          api-secret: ${{ secrets.MISE_VERSIONS_API_SECRET }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mise-ubuntu-latest
          path: target/debug
      - run: echo "$PWD/target/debug" >> "$GITHUB_PATH" && chmod +x target/debug/mise
      - parallel:
          - uses: ./.github/actions/mise-tools
          - name: Pull e2e Docker image
            run: docker pull ghcr.io/jdx/mise:e2e
      # Each test gets isolated host directories and an ephemeral container.
      # Run four branches on a standard runner; each branch handles two
      # token-isolated tranches sequentially, capped at eight containers total.
      - parallel:
          - name: Test tranches 0 and 4
            uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
            env:
              E2E_JOBS: 2
              MISE_E2E_DOCKER: "1"
              TEST_ALL: ${{(github.head_ref == 'release' || github.ref == 'refs/heads/release') && '1' || '0'}}
              TEST_TRANCHE_COUNT: 8
              TRANCHE_A: 0
              TRANCHE_B: 4
              TOKEN_A: ${{ steps.token_0.outputs.token || secrets.MISE_GH_TOKEN || secrets.GITHUB_TOKEN }}
              TOKEN_B: ${{ steps.token_4.outputs.token || secrets.MISE_GH_TOKEN || secrets.GITHUB_TOKEN }}
            with: &e2e-retry
              timeout_minutes: 30
              retry_wait_seconds: 30
              max_attempts: 2
              command: |
                MISE_GITHUB_TOKEN="$TOKEN_A" GITHUB_TOKEN="$TOKEN_A" TEST_TRANCHE="$TRANCHE_A" ./e2e/run_all_tests
                MISE_GITHUB_TOKEN="$TOKEN_B" GITHUB_TOKEN="$TOKEN_B" TEST_TRANCHE="$TRANCHE_B" ./e2e/run_all_tests
          - name: Test tranches 1 and 5
            uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
            env:
              E2E_JOBS: 2
              MISE_E2E_DOCKER: "1"
              TEST_ALL: ${{(github.head_ref == 'release' || github.ref == 'refs/heads/release') && '1' || '0'}}
              TEST_TRANCHE_COUNT: 8
              TRANCHE_A: 1
              TRANCHE_B: 5
              TOKEN_A: ${{ steps.token_1.outputs.token || secrets.MISE_GH_TOKEN || secrets.GITHUB_TOKEN }}
              TOKEN_B: ${{ steps.token_5.outputs.token || secrets.MISE_GH_TOKEN || secrets.GITHUB_TOKEN }}
            with: *e2e-retry
          - name: Test tranches 2 and 6
            uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
            env:
              E2E_JOBS: 2
              MISE_E2E_DOCKER: "1"
              TEST_ALL: ${{(github.head_ref == 'release' || github.ref == 'refs/heads/release') && '1' || '0'}}
              TEST_TRANCHE_COUNT: 8
              TRANCHE_A: 2
              TRANCHE_B: 6
              TOKEN_A: ${{ steps.token_2.outputs.token || secrets.MISE_GH_TOKEN || secrets.GITHUB_TOKEN }}
              TOKEN_B: ${{ steps.token_6.outputs.token || secrets.MISE_GH_TOKEN || secrets.GITHUB_TOKEN }}
            with: *e2e-retry
          - name: Test tranches 3 and 7
            uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
            env:
              E2E_JOBS: 2
              MISE_E2E_DOCKER: "1"
              TEST_ALL: ${{(github.head_ref == 'release' || github.ref == 'refs/heads/release') && '1' || '0'}}
              TEST_TRANCHE_COUNT: 8
              TRANCHE_A: 3
              TRANCHE_B: 7
              TOKEN_A: ${{ steps.token_3.outputs.token || secrets.MISE_GH_TOKEN || secrets.GITHUB_TOKEN }}
              TOKEN_B: ${{ steps.token_7.outputs.token || secrets.MISE_GH_TOKEN || secrets.GITHUB_TOKEN }}
            with: *e2e-retry

  bootstrap-linux-host:
    runs-on: namespace-profile-endev-linux-amd64;overrides.cache-tag=mise-pr-rust-linux
    timeout-minutes: 20
    needs: [build-ubuntu, classify-changes]
    if: needs.classify-changes.outputs.full-ci == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mise-ubuntu-latest
          path: target/debug
      - run: chmod +x target/debug/mise
      - name: Converge a complete Linux host over SSH
        run: scripts/test-bootstrap-linux-host.sh target/debug/mise

  windows-unit:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [classify-changes]
    if: needs.classify-changes.outputs.full-ci == 'true'
    env:
      MISE_DATA_DIR: ~/.local/share/mise
      MISE_CACHE_DIR: ~/.cache/mise
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 # zizmor: ignore[cache-poisoning] save-if already gates writes to main/release
        with:
          shared-key: build
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release' }}
      - name: check unused code
        run: cargo check -p mise --no-default-features --features rustls-native-roots,vfox/vendored-lua,self_update --all-targets
        env:
          RUSTFLAGS: -D unused
      - name: cargo test
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 30
          retry_wait_seconds: 30
          max_attempts: 2
          command: cargo test
      # Windows is where the members rot fastest: their tests assume POSIX paths and shells
      # unless something runs them here.
      - name: cargo test (workspace members)
        run: cargo test --workspace --exclude mise
  windows-e2e:
    runs-on: windows-latest
    timeout-minutes: 100
    needs: [build-windows, classify-changes]
    if: needs.classify-changes.outputs.full-ci == 'true'
    env:
      MISE_DATA_DIR: ~/.local/share/mise
      MISE_CACHE_DIR: ~/.cache/mise
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mise-windows-latest
          path: target/debug
      - run: ls target\debug
      - run: Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\target\debug"
      - uses: ./.github/actions/mise-tools
      - name: e2e
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 30
          retry_wait_seconds: 30
          max_attempts: 2
          command: pwsh e2e-win\run.ps1

  test-ci:
    runs-on: namespace-profile-endev-linux-amd64;overrides.cache-tag=mise-pr-rust-linux
    timeout-minutes: 1
    needs:
      - classify-changes
      - build-ubuntu
      - build-windows
      - unit
      - nightly
      - lint
      - e2e
      - bootstrap-linux-host
      - windows-unit
      - windows-e2e
    # Evaluate skipped and failed dependencies, but do not waste a runner when
    # the workflow is cancelled.
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Check CI job results
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          full_ci="${{ needs.classify-changes.outputs.full-ci }}"
          if [ "${{ needs.build-ubuntu.result }}" != "success" ]; then
            echo "build-ubuntu failed or was skipped"
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "lint failed or was skipped"
            exit 1
          fi

          if [ "$full_ci" == "true" ]; then
            if [ "${{ needs.build-windows.result }}" != "success" ]; then
              echo "build-windows failed or was skipped"
              exit 1
            fi
            if [ "${{ needs.unit.result }}" != "success" ]; then
              echo "unit failed or was skipped"
              exit 1
            fi
            if [ "${{ github.event_name }}" == "pull_request" ] && [ "$HEAD_REF" == "release" ] && [ "$BASE_REF" == "main" ]; then
              if [ "${{ needs.e2e.result }}" != "skipped" ]; then
                echo "e2e should be handled by the release workflow"
                exit 1
              fi
            elif [ "${{ needs.e2e.result }}" != "success" ]; then
              echo "e2e failed or was skipped"
              exit 1
            fi
            if [ "${{ needs.bootstrap-linux-host.result }}" != "success" ]; then
              echo "bootstrap-linux-host failed or was skipped"
              exit 1
            fi
            if [ "${{ needs.windows-unit.result }}" != "success" ]; then
              echo "windows-unit failed or was skipped"
              exit 1
            fi
            if [ "${{ needs.windows-e2e.result }}" != "success" ]; then
              echo "windows-e2e failed or was skipped"
              exit 1
            fi
          else
            for result in \
              "${{ needs.build-windows.result }}" \
              "${{ needs.unit.result }}" \
              "${{ needs.e2e.result }}" \
              "${{ needs.bootstrap-linux-host.result }}" \
              "${{ needs.windows-unit.result }}" \
              "${{ needs.windows-e2e.result }}"; do
              if [ "$result" != "skipped" ]; then
                echo "docs-only jobs should be skipped"
                exit 1
              fi
            done
          fi
          echo "All CI jobs completed successfully"
