name: test

on:
  push:
    tags: ["v*"]
    branches: ["main", "mise", "release"]
  pull_request:
    # Stacked PRs need the same platform checks before their base reaches main.
    branches: ["main", "codex/**"]
  workflow_dispatch:
  workflow_call:
    secrets:
      FORGEJO_TOKEN:
        required: false
      MISE_GH_TOKEN:
        required: false
      MISE_VERSIONS_API_SECRET:
        required: false

# Held by the caller, which only calls test-impl.yml: a group set inside the
# called workflow would use this workflow's name too and wait for this run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions: {}

jobs:
  trusted:
    if: ${{ (github.actor == 'jdx' || github.actor == 'mise-en-dev') && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.user.login == 'jdx' || github.event.pull_request.user.login == 'mise-en-dev'))) }}
    permissions:
      contents: read
    uses: $/.github/workflows/test-impl.yml
    with:
      trusted: true
    secrets:
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      MISE_GH_TOKEN: ${{ secrets.MISE_GH_TOKEN }}
      MISE_VERSIONS_API_SECRET: ${{ secrets.MISE_VERSIONS_API_SECRET }}

  untrusted:
    if: ${{ (github.actor != 'jdx' && github.actor != 'mise-en-dev') || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || (github.event.pull_request.user.login != 'jdx' && github.event.pull_request.user.login != 'mise-en-dev'))) }}
    permissions:
      contents: read
    uses: $/.github/workflows/test-impl.yml
    with:
      trusted: false

  # Pushes the timings that the unit job recorded on main. It is its own job so
  # the test jobs, which run pull request code, never hold a write token, and
  # nothing waits on it.
  jouet-cost:
    name: jouet-cost
    needs: [trusted]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false # the token reaches only the push step
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: jouet
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jouet-cost-*
          merge-multiple: true
          path: jouet-cost-bundles
      - name: Merge and push the timings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic $auth"
          for b in jouet-cost-bundles/*.bundle; do
            [ -e "$b" ] || continue
            jouet cost fetch "./$b"
          done
          jouet cost push

  test-ci:
    name: test-ci
    if: ${{ always() && !cancelled() && needs.trusted.result != 'cancelled' && needs.untrusted.result != 'cancelled' }}
    permissions: {}
    needs: [trusted, untrusted]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check selected workflow result
        env:
          TRUSTED_RESULT: ${{ needs.trusted.result }}
          UNTRUSTED_RESULT: ${{ needs.untrusted.result }}
        run: |
          if [[ "$TRUSTED_RESULT" == success && "$UNTRUSTED_RESULT" == skipped ]] ||
             [[ "$TRUSTED_RESULT" == skipped && "$UNTRUSTED_RESULT" == success ]]; then
            exit 0
          fi
          echo "trusted=$TRUSTED_RESULT untrusted=$UNTRUSTED_RESULT"
          exit 1
