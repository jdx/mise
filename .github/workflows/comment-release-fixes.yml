name: comment-release-fixes

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to comment for (e.g., v2026.9.18)"
        required: true
        type: string
      dry_run:
        description: "Print the comments instead of posting them"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: comment-release-fixes-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  comment:
    if: github.repository == 'jdx/mise' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v'))
    permissions:
      contents: read
      pull-requests: read
      issues: write
      discussions: write
    uses: jdx/workflows/.github/workflows/comment-release-fixes.yml@4c952564543dd54d60f15ef4062af7fb60c5561d
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name }}
      marker_prefix: mise-fixed-in
      upgrade_text: Update with `mise self-update` or see the [install docs](https://mise.jdx.dev/installing-mise.html).
      dry_run: ${{ inputs.dry_run || false }}
