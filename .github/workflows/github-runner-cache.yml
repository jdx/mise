name: github runner cache

on:
  push:
    branches: [main]

concurrency:
  group: github-runner-cache-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  warm:
    name: warm-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/mbx
        with:
          backend: github
      - name: Warm the Unix cache
        if: runner.os != 'Windows'
        run: mbx build --all-features --ignore-rust-version
      - name: Warm the Windows cache
        if: runner.os == 'Windows'
        env:
          MBX_TARGET_VIEWS: "0"
        run: |
          mbx build --no-default-features --features rustls-native-roots,vfox/vendored-lua,self_update
          mbx build -p mise-shim
