name: github runner cache

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

concurrency:
  group: github-runner-cache-${{ github.ref }}
  # Let the active warmer publish a usable cache when several commits land on
  # main in quick succession. GitHub still keeps only the newest pending run.
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  warm:
    if: github.ref == 'refs/heads/main'
    name: warm-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.global-cache
            ~/.cache/mbx
          key: ${{ runner.os }}-${{ runner.arch }}-fork-pr-mbx-v0.2.0-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-fork-pr-mbx-v0.2.0-
      - uses: ./.github/actions/setup-mbx
      - run: mbx build build --all-features --ignore-rust-version
      # Bound each immutable GHA cache entry so Linux and macOS can coexist
      # within the repository cache quota.
      - run: mbx gc --max-size 3GB
        if: always()
