name: publish release index only

on:
  workflow_dispatch:

concurrency:
  group: publish-version
  queue: max

permissions:
  contents: read

jobs:
  release-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Generate stable release index
        timeout-minutes: 75
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source scripts/gh-api-retry.sh
          gh_api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          jq -sr '
            add | map(select(.draft == false and .prerelease == false)) |
            map(select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) |
            if length == 0 then error("no stable mise releases") else . end |
            sort_by(.tag_name | ltrimstr("v") | split(".") | map(tonumber)) | reverse |
            .[] | [.tag_name, (.published_at | fromdateiso8601)] | @tsv
          ' "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/releases.tsv"
          test -s "$RUNNER_TEMP/releases.tsv"
          wc -l "$RUNNER_TEMP/releases.tsv"
          sha256sum "$RUNNER_TEMP/releases.tsv"
      - name: Upload only releases.tsv
        timeout-minutes: 5
        env:
          AWS_REGION: auto
          AWS_ENDPOINT_URL: https://6e243906ff257b965bcae8025c2fc344.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          AWS_RETRY_MODE: adaptive
          AWS_MAX_ATTEMPTS: 10
        run: |
          aws s3 cp "$RUNNER_TEMP/releases.tsv" s3://mise/releases.tsv \
            --cache-control "max-age=300,s-maxage=300,public" \
            --no-progress --content-type "text/plain"
      - name: Purge only the release index URL
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST https://api.cloudflare.com/client/v4/zones/90dfd7997bdcfa8579c52d8ee8dd4cd1/purge_cache \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://mise.jdx.dev/releases.tsv"]}' | jq -e '.success == true'
      - name: Verify public release index
        timeout-minutes: 2
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://mise.jdx.dev/releases.tsv -o "$RUNNER_TEMP/public-releases.tsv"
          cmp "$RUNNER_TEMP/releases.tsv" "$RUNNER_TEMP/public-releases.tsv"
          sha256sum "$RUNNER_TEMP/public-releases.tsv"
