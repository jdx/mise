name: publish-version

on:
  release:
    types: [published]
  schedule:
    # Reconcile /VERSION with the latest published release. A release-triggered
    # run can fail for reasons unrelated to the release itself (a transient
    # GitHub API rate limit, a dropped webhook, a runner outage), which would
    # otherwise leave /VERSION pointing at the previous release indefinitely.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Published release tag to expose (e.g., v2026.9.3)"
        required: true
        type: string

concurrency:
  # One writer for s3://mise/VERSION regardless of what triggered the run, so a
  # scheduled reconciliation can never race a release or a manual recovery.
  group: publish-version
  # Sharing one group means every trigger shares one pending slot, and the
  # default `queue: single` lets an arriving run cancel whatever is already
  # pending. Queue them instead so a scheduled run cannot displace a pending
  # release or manual recovery.
  queue: max

jobs:
  publish-version:
    if: |
      github.event_name != 'release' ||
      (startsWith(github.event.release.tag_name, 'v') &&
       !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Release events normally check out the tag. Use the trusted default
          # branch so recovery also works for tags created before this script.
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve published release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # The release workflow fans out across many jobs that all spend the
          # repository's hourly GITHUB_TOKEN budget, so this call is the most
          # likely thing to fail during a release. Retry before giving up; the
          # scheduled run covers anything a short backoff cannot.
          gh_api() {
            local attempt delay out
            for attempt in 1 2 3 4 5; do
              if out=$(gh api "$@"); then
                printf '%s' "$out"
                return 0
              fi
              if ((attempt == 5)); then
                break
              fi
              delay=$((5 * 2 ** (attempt - 1)))
              echo "::warning::gh api $1 failed (attempt $attempt/5); retrying in ${delay}s" >&2
              sleep "$delay"
            done
            echo "::error::gh api $1 failed after 5 attempts" >&2
            return 1
          }

          # /releases/latest is by definition the newest release that is neither
          # a draft nor a prerelease, so matching it proves the tag is a
          # published stable release without spending a second API call.
          LATEST_TAG="$(gh_api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          TAG="${EVENT_TAG:-${INPUT_VERSION:-$LATEST_TAG}}"
          if ! [[ "$TAG" =~ ^v[0-9][0-9A-Za-z._+-]*$ ]]; then
            echo "::error::Invalid release tag: $TAG" >&2
            exit 1
          fi
          if [[ "$TAG" != "$LATEST_TAG" ]]; then
            echo "::error::$TAG is not the latest stable release ($LATEST_TAG)" >&2
            exit 1
          fi

          # A release or manual run also refreshes the CDN for assets and
          # install scripts staged while the release was still a draft, so it
          # always publishes. A scheduled run exists only to repair a stale
          # pointer and stays a no-op the rest of the time.
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            CURRENT="$(curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 https://mise.jdx.dev/VERSION || true)"
            if [[ "v$CURRENT" == "$TAG" ]]; then
              echo "VERSION already serves $TAG; nothing to publish"
              echo "skip=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::VERSION serves ${CURRENT:-<unavailable>} but $TAG is the latest release; republishing"
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"

      - name: Publish VERSION and purge release caches
        if: steps.release.outputs.skip != 'true'
        env:
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
        run: ./scripts/publish-version.sh "${{ steps.release.outputs.tag }}"
