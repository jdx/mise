name: publish-version

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Published release tag to expose (e.g., v2026.9.3)"
        required: true
        type: string

concurrency:
  # s3://mise/VERSION has one writer, so every run shares one group rather than
  # grouping per tag. Two runs for different tags each pass the latest-release
  # check below before either publishes, so overlapping them lets an older run
  # finish last and move the pointer backwards. Serialized, a run that is no
  # longer publishing the latest release re-resolves and refuses.
  group: publish-version
  # One group also means one pending slot, and the default `queue: single` lets
  # an arriving run cancel whatever is pending — which could drop a release run
  # that nothing else will retry. Queue them instead. (actionlint 1.7.12 does
  # not know this key yet; GitHub documents it and accepts it.)
  queue: max

jobs:
  publish-version:
    if: |
      (github.event_name == 'release' &&
       startsWith(github.event.release.tag_name, 'v') &&
       !github.event.release.prerelease) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Release lookups and index generation may take hours, but only because they
    # wait out a rate-limit window. This is the outer ceiling; each step sets
    # its own bound so the generous value here never applies to work that
    # should be quick — a run holds the concurrency group until it ends.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 5
        with:
          # Release events normally check out the tag. Use the trusted default
          # branch so recovery also works for tags created before this script.
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve published release
        id: release
        # One reset wait (capped below) plus the short backoffs, with slack.
        timeout-minutes: 75
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          source scripts/gh-api-retry.sh

          TAG="${EVENT_TAG:-$INPUT_VERSION}"
          if ! [[ "$TAG" =~ ^v[0-9][0-9A-Za-z._+-]*$ ]]; then
            echo "::error::Invalid release tag: $TAG" >&2
            exit 1
          fi
          # /releases/latest is by definition the newest release that is neither
          # a draft nor a prerelease, so matching it proves the tag is a
          # published stable release without spending a second API call.
          LATEST_TAG="$(gh_api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          if [[ "$TAG" != "$LATEST_TAG" ]]; then
            echo "::error::$TAG is not the latest stable release ($LATEST_TAG)" >&2
            exit 1
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"

      - name: Publish VERSION and purge release caches
        # Index pagination uses the same reset-aware retry policy as the lookup.
        timeout-minutes: 75
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
        run: ./scripts/publish-version.sh "${{ steps.release.outputs.tag }}"
