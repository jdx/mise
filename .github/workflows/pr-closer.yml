name: pr-closer

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight
  workflow_dispatch:

concurrency:
  group: pr-closer
  cancel-in-progress: false

jobs:
  pr-closer:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - uses: jdx/pr-closer@cfa2025cb55ac202d3e329fc4cc412449de884e2 # v1.3.0
