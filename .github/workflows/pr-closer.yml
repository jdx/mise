name: pr-closer

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight
  workflow_dispatch:

jobs:
  pr-closer:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - uses: jdx/pr-closer@9e82f2808d88b029f0a980696725d7d6d62f3c6f # v1.2.0
