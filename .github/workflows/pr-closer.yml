name: pr-closer

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight
  workflow_dispatch:

jobs:
  pr-closer:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - uses: jdx/pr-closer@aa440aa11a9e4ff3515089f26fb0417a2db32e76 # PR #10 merge
